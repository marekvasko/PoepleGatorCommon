[project]
name = "people-gator-common"
version = "0.1.0"
description = "Shared utilities and data models for the People Gator monorepo"
readme = "README.md"
authors = [
    { name = "Marek Vaško", email = "ivasko@fit.vutbr.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "aiodns>=4.0.0",
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "fsspec>=2026.4.0",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "jellyfish>=1.2.1",
    "lakefs-spec>=0.14.0",
    "lxml>=6.1.0",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
    "openai>=2.41.1",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "pymarc>=5.3.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "qdrant-client>=1.15.1",
    "rapidfuzz>=3.14.5",
    "recordlinkage>=0.14",
    "requests>=2.33.1",
    "scikit-learn>=1.6.1",
    "s3fs>=2026.4.0",
    "seaborn>=0.13.2",
    "sparqlwrapper>=2.0.0",
    "tqdm>=4.67.3",
    "opentelemetry-sdk>=1.42.1",
    "fuzzysearch>=0.8.1",
    "weaviate-client>=4.21.2",
    "openrouter>=1.1.157",
]

[project.scripts]
people-gator-wikidata = "people_gator_common.cli.wikidata_pipeline_cli:main"
people-gator-wikidata-v2 = "people_gator_common.cli.wikidata_v2_pipeline_cli:main"
people-gator-wikicommons = "people_gator_common.cli.wikicommons_pipeline_cli:main"
people-gator-nlcr = "people_gator_common.cli.nlcr_pipeline_cli:main"
people-gator-obalkyknih-html = "people_gator_common.cli.obalkyknih_html_pipeline_cli:main"
people-gator-obalkyknih-extract = "people_gator_common.cli.obalkyknih_extraction_pipeline_cli:main"
people-gator-obalkyknih-images = "people_gator_common.cli.obalkyknih_image_pipeline_cli:main"
people-gator-embed-names  = "people_gator_common.cli.embed_names_pipeline_cli:main"
people-gator-embed-faces = "people_gator_common.cli.embed_faces_pipeline_cli:main"
people-gator-ner-postprocess = "people_gator_common.cli.ner_postprocess_pipeline_cli:main"
people-gator-ner-map-to-chunks = "people_gator_common.cli.ner_map_to_chunks_pipeline_cli:main"
people-gator-llm-ner = "people_gator_common.cli.llm_ner_pipeline_cli:main"
people-gator-import-authorities = "people_gator_common.cli.import_authorities_cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]
